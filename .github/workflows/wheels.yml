# Builds the sdist and binary wheels with GSL bundled inside (so `pip install gaiamock` doesn't need GSL),
# and uploads them to PyPI when a GitHub release is published. The cibuildwheel settings are in pyproject.toml.
#
# Publishing uses PyPI trusted publishing: before the first release, add this repository as a trusted
# publisher for the gaiamock project on pypi.org (workflow: wheels.yml, environment: pypi).
name: Build and publish

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/prepare_release_sources.py
      # Keep the existing minimum macOS version for the initial release.
      - if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.3.0
      - run: python3 tools/check_release.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/prepare_release_sources.py
      - run: pipx run build --sdist
      - run: python3 tools/check_release.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
